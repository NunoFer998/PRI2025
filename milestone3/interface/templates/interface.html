<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solr Medical Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>🔍 Symptom & Medical Search</h1>
    </header>

    <main>
        <section id="search-container">
            <input type="text" id="search-input" placeholder="Enter symptoms, diseases, or keywords..." aria-label="Search symptoms">
            <button id="search-button">Search Solr</button>
        </section>

        <section id="results-container" aria-live="polite">
            <p id="initial-message">Enter a search term and click 'Search Solr' to see results.</p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
